name: Daily Smoke Tests & Email Report

on:
  schedule:
    # Runs everyday at 06:00 AM EDT (10:00 UTC)
    - cron: '0 10 * * *'
  workflow_dispatch:

jobs:
  smoke-test:
    name: Execute Smoke Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Playwright Browsers & Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Smoke Tests
        id: run_tests
        env:
          ZELLA_QA_URL: ${{ secrets.ZELLA_QA_URL || 'https://zellablinds.com/' }}
          ZELLA_PASSWORD: ${{ secrets.ZELLA_PASSWORD || 'NewHartford20@%' }}
          CI: true
        run: npm run test:smoke

      - name: Package Playwright HTML Report
        if: always()
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          if [ -d "playwright-report" ]; then
            zip -r playwright-report.zip playwright-report/
          else
            echo "No playwright-report folder generated" > summary.txt
            zip playwright-report.zip summary.txt
          fi

      - name: Upload Playwright Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Send Test Report Email to zellablinds@gmail.com
        uses: dawidd6/action-send-mail@v4
        if: always()
        continue-on-error: true
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "[Playwright CI] Daily Smoke Test Report - ${{ job.status }} - ${{ github.repository }}"
          to: zellablinds@gmail.com
          from: "Zella Blinds Automation <${{ secrets.SMTP_USERNAME }}>"
          body: |
            Playwright Automated Smoke Test Daily Report

            Result: ${{ job.status }}
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Trigger: ${{ github.event_name }}
            Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            The complete Playwright HTML test report is attached as playwright-report.zip.
            To view the report, extract the zip file and run:
            npx playwright show-report <extracted_folder>
          attachments: playwright-report.zip
